<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙 연산 계산기</title>
    <script src="../js/calculator.js"></script>
</head>
<body>
    <h1> 콘솔창 계산기 프로그램 </h1>
    <h3> Window OS의 경우  </h3>
    <hr>
    <p> 1. F12키를 눌러서 콘솔 창을 열어주세요. </p>
    <p> 2. start()를 콘솔창에 입력하여 계산기를 실행합니다. 괄호를 꼭 넣어주세요. </p>
    <h3>Mac OS의 경우 </h3>
    <hr>
    <p> 1. Option + Command + i 키를 눌러 콘솔 창을 여세요. </p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
     
    
</body>
</html>
