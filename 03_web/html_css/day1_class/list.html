<body>
    <!-- list: 여러 개의 데이터를 출력 -->
    <!-- ul: Unordered List (순서 없는 목록) -->
    <ul>
        <!-- li: List Item (목록의 각 항목) -->
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <!-- ol: Ordered List (순서 있는 목록) -->
    <!-- 속성(Attribute): 태그에 추가 정보를 주는 것 -->
    <!-- type="I": 번호를 로마 숫자 대문자로 표시 -->
    <ol type="I">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <!-- start="-10": 번호를 -10부터 시작 -->
    <ol start="-10">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>
</body>
