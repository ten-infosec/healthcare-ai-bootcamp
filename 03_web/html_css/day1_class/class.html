<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- id: identity, 페이지 안에서 중복 X (하나의 요소에만) -->
    <!-- class: 같은 이름을 여러 요소에 붙일 수 있음 (그룹 이름) -->
    <h3 id="title" class="first-paragraph">HTML 기본 문법</h3>
    <p id="contents" class="first-paragraph">HTML은 태그로 이루어져 있다.</p>
</body>
</html>
