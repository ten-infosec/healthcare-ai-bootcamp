<!DOCTYPE html>
<html lang="ko">
    <!-- 헤드: 화면에 대한 부가 정보 (화면에 직접 보이지 않음) -->
    <head>
        <meta charset="UTF-8">
        <title>My Page</title>
    </head>

    <!-- 본문: 웹 페이지의 실제 화면 -->
    <body>
        <!-- 헤딩(heading): 제목 (h1이 가장 크고 중요, h6까지 있음) -->
        <h1>Hello, HTML</h1>
        <h2>HTML의 특징</h2>
        <h3>1. HTML은 tag로 이루어진다.</h3>

        <!-- 문단(paragraph): 하나의 글 덩어리 -->
        <p>모든 HTML은 tag의 형태로 작성된다...</p>
    </body>
</html>
