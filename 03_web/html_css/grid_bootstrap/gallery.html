<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(4, 200px);
            gap: 10px;

            grid-template-areas:
                "img1 img1 img5"
                "img1 img1 img5"
                "img3 img2 img5"
                "img4 img6 img5";
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.6rem;
            transition: filter 0.3s, opacity 0.3s;
        }

        .img2 img {
            object-fit: contain;
            background-color: #f3f3f3;
        }

        .container:hover img:not(:hover) {
            filter: grayscale(1);
            opacity: 0.5;
        }

        .img1 { grid-area: img1; }
        .img2 { grid-area: img2; }
        .img3 { grid-area: img3; }
        .img4 { grid-area: img4; }
        .img5 { grid-area: img5; }
        .img6 { grid-area: img6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="item img1"><img src="https://images.unsplash.com/photo-1596733430284-f7437764b1a9?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 1"></div>
        <div class="item img2"><img src="https://plus.unsplash.com/premium_photo-1666777247416-ee7a95235559?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 2"></div>
        <div class="item img3"><img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 3"></div>
        <div class="item img4"><img src="https://images.unsplash.com/photo-1714199673971-0899b750f301?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 4"></div>
        <div class="item img5"><img src="https://images.unsplash.com/photo-1604336755604-96ee6fa9f3f1?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 5"></div>
        <div class="item img6"><img src="https://plus.unsplash.com/premium_photo-1661943783203-8c4b8dc3a646?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="photo 6"></div>
    </div>
</body>
</html>
